<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#013364">
<title>المنتجات الرقمية حسب المستفيدين</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen kiosk. Top bar (forum identity) · stage = beneficiary rail + services grid that is sized
   by script to fill the remaining height · service details open in a modal with two QR codes. Single dark forum look. */
:root{
  --navy:#013364; --deep:#041c39; --blue:#0166aa; --green:#2bb673; --gold:#ffbd59;
  --white:#f7fbff; --soft:#bbd6e7; --muted:#8fb2cb; --line:rgba(183,221,244,.2);
  --panel:rgba(7,43,81,.86); --card:linear-gradient(157deg,#124876,#082d54); --ink:#062744;
  --ok:#7ff0b8; --qr-ink:#013364; --qr-paper:#ffffff;
  --font:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 16px 45px rgba(0,9,32,.38);
  --gut:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(14px,calc(.62vw + .85vh),24px)}
html,body{height:100%;margin:0;overflow:hidden;background:#041d3b;color:var(--white)}
body{font-family:var(--font);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

#app{
  position:fixed;inset:0;isolation:isolate;display:flex;flex-direction:column;overflow:hidden;
  font-size:1rem;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:
    radial-gradient(circle at 12% 14%,rgba(43,182,115,.15),transparent 28%),
    radial-gradient(circle at 88% 90%,rgba(1,102,170,.4),transparent 38%),
    linear-gradient(135deg,#041c39,#013364 60%,#041d3b);
}
#app::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px}
.shell{width:100%;max-width:94rem;margin-inline:auto;padding-left:var(--gut);padding-right:var(--gut-r)}

/* ambient */
.bg-fx{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg-fx b{position:absolute;width:38rem;height:38rem;border-radius:50%;background:radial-gradient(circle,rgba(43,182,115,.15),transparent 65%);top:-14rem;inset-inline-start:-11rem;animation:orb 24s ease-in-out infinite alternate}
.bg-fx b.b2{top:auto;bottom:-17rem;inset-inline-start:auto;inset-inline-end:-12rem;background:radial-gradient(circle,rgba(255,189,89,.09),transparent 62%);animation-duration:30s}
.bg-fx i{position:absolute;bottom:-5rem;left:var(--x);width:var(--s);height:var(--s);border-radius:28%;border:1.5px solid rgba(43,182,115,var(--o));background:linear-gradient(135deg,rgba(36,90,122,.14),transparent);animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes orb{to{transform:translate(-6rem,8rem) scale(1.15)}}
@keyframes drift{0%{opacity:0;transform:translateY(0) rotate(0)}10%,85%{opacity:1}100%{opacity:0;transform:translateY(-120vmax) rotate(160deg)}}

/* ===== Top bar ===== */
.topbar{flex:none;position:relative;z-index:5}
.topbar .shell{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding-block:.6rem}
.topbar .shell::after{content:"";position:absolute;inset:auto 0 0;height:1px;background:var(--line)}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0;flex:1}
.brand img{width:2.9rem;height:2.9rem;flex:none;filter:drop-shadow(0 2px 6px rgba(0,10,30,.35))}
.brand b{display:block;font-size:1.12rem;line-height:1.3}
.brand small{display:block;font-size:.78rem;color:#ecf7ff;opacity:.8;line-height:1.4}
.toolbar{display:flex;gap:.5rem;flex:none}
.tool{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;min-width:44px;padding:.4rem .9rem;border-radius:.8rem;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:.86rem;font-weight:600;white-space:nowrap;transition:background .2s,transform .15s}
.tool:hover{background:rgba(255,255,255,.16)}
.tool:active{transform:scale(.95)}
.tool.primary{border-color:rgba(43,182,115,.5);background:rgba(43,182,115,.14)}
.tool svg{width:1.1rem;height:1.1rem}

/* ===== Stage ===== */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(14rem,17.5rem) minmax(0,1fr);gap:1rem;padding-block:.9rem .5rem}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:1.4rem;box-shadow:var(--shadow);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* rail */
.rail{min-height:0;display:flex;flex-direction:column;gap:.7rem;padding:.9rem}
.r-head b{display:block;font-size:1.2rem;line-height:1.35}
.r-head small{display:block;font-size:.8rem;color:var(--soft);line-height:1.5}
.r-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:.45rem}
.pb{flex:1 1 0;min-height:2.6rem;max-height:4.4rem;display:flex;align-items:center;gap:.65rem;padding:.35rem .7rem;border-radius:1rem;text-align:start;
  background:rgba(255,255,255,.05);border:1.5px solid var(--line);font-weight:600;font-size:.95rem;transition:background .2s,border-color .2s,transform .25s var(--spring)}
.pb:hover{background:rgba(255,255,255,.1);border-color:rgba(255,189,89,.45)}
.pb:active{transform:scale(.97)}
.pb .pi{flex:none;width:2.2rem;height:2.2rem;border-radius:.75rem;display:grid;place-items:center;font-size:1.2rem;line-height:1;background:rgba(255,255,255,.07)}
.pb .pl{flex:1;min-width:0;line-height:1.35}
.pb .pc{flex:none;min-width:2rem;padding:.05rem .5rem;border-radius:99px;text-align:center;font-size:.82rem;font-weight:700;background:rgba(255,255,255,.1);font-variant-numeric:tabular-nums}
.pb[aria-pressed="true"]{background:linear-gradient(135deg,#1f9a63,#137067);border-color:transparent;box-shadow:0 8px 24px rgba(31,154,99,.35);transform:translateX(calc(var(--dirx,-1) * .3rem))}
.pb[aria-pressed="true"] .pi{background:rgba(255,255,255,.18)}
.pb[aria-pressed="true"] .pc{background:var(--gold);color:var(--ink)}
#app[dir="ltr"]{--dirx:1}

/* panel */
.panel{min-width:0;min-height:0;display:flex;flex-direction:column;gap:.75rem;padding:.9rem}
.p-head{flex:none;display:flex;justify-content:space-between;align-items:flex-end;gap:.4rem 1rem;flex-wrap:wrap}
.kicker{display:inline-flex;align-items:center;gap:.45rem;font-size:.78rem;color:#b1efd2;font-weight:600}
.kicker .dot{position:relative;width:.5rem;height:.5rem;border-radius:50%;background:var(--green)}
.kicker .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--green);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(3);opacity:0}}
.p-head h1{font-size:1.55rem;line-height:1.35;margin-top:.1rem}
.p-head h1 .grad{background:linear-gradient(90deg,#b0f2d0,#ffda9d,#b0f2d0);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 6s linear infinite}
@keyframes grad{to{background-position:200% center}}
.p-meta{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .7rem;border-radius:99px;font-size:.8rem;background:rgba(255,255,255,.06);border:1px solid var(--line);white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums;color:var(--gold)}
.chip .sw{width:.7rem;height:.7rem;border-radius:.25rem;background:var(--green)}
.chip .sw.g{background:transparent;border:1.5px dashed var(--soft)}
.chip.hint{border-style:dashed;color:var(--soft)}

/* services grid */
.grid{flex:1;min-height:0;display:grid;gap:.7rem;grid-template-columns:repeat(var(--c,6),minmax(0,1fr));grid-template-rows:repeat(var(--r,4),minmax(0,1fr));font-size:calc(1rem * var(--k,1))}
.grid.scroll{grid-template-rows:none;grid-auto-rows:minmax(7.6rem,auto);overflow-y:auto;overscroll-behavior:contain;padding-inline-end:.2rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.tile{position:relative;overflow:hidden;min-width:0;min-height:0;display:flex;flex-direction:column;gap:.45em;padding:.8em .85em;border-radius:1.1em;text-align:start;
  background:var(--card);border:1px solid var(--line);box-shadow:0 10px 26px rgba(0,8,30,.28);transition:transform .3s var(--spring),border-color .2s,box-shadow .3s}
.tile::after{content:"";position:absolute;inset-inline-end:-3.5em;top:-3.8em;width:8em;height:8em;border-radius:50%;background:var(--gc);opacity:.12;filter:blur(6px);pointer-events:none;transition:transform .5s var(--ease),opacity .3s}
.tile:hover{transform:translateY(-4px);border-color:var(--gc);box-shadow:0 18px 36px rgba(0,8,30,.42),0 0 26px color-mix(in srgb,var(--gc) 22%,transparent)}
.tile:hover::after{transform:scale(1.45);opacity:.2}
.tile:active{transform:scale(.97)}
.tile.gen{background:linear-gradient(157deg,rgba(18,72,118,.62),rgba(8,45,84,.62));border-style:dashed;border-color:rgba(183,221,244,.32)}
.t-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:.5em}
.t-ico{flex:none;width:2.45em;height:2.45em;border-radius:.8em;display:grid;place-items:center;font-size:1.05em;background:color-mix(in srgb,var(--gc) 17%,transparent);border:1px solid color-mix(in srgb,var(--gc) 38%,transparent)}
.t-ico span{font-size:1.3em;line-height:1}
.t-type{font-size:.74em;font-weight:700;padding:.12em .7em;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--line);white-space:nowrap}
.t-type.p{background:rgba(138,206,255,.12);border-color:rgba(138,206,255,.4)}
.t-type.s{background:rgba(255,189,89,.12);border-color:rgba(255,189,89,.45)}
.t-name{flex:none;font-size:1.06em;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.t-foot{flex:none;margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:.4em;font-size:.76em;color:var(--soft);min-width:0}
.t-tag{display:inline-flex;align-items:center;gap:.35em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-tag.d{color:var(--ok);font-weight:700}
.t-go{flex:none;font-weight:700;color:var(--white);opacity:.75;transition:transform .25s var(--ease),opacity .2s}
.tile:hover .t-go{opacity:1;transform:translateX(calc(var(--dirx,-1) * .3em))}
.grid.enter .tile{animation:popIn .5s var(--spring) backwards;animation-delay:calc(var(--i,0) * 28ms)}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.92)}}

.foot{flex:none;font-size:.72rem;color:#aacbe0;text-align:center;padding-block:.15rem .55rem}

/* ===== Modal ===== */
.m-ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  padding:max(2vh,env(safe-area-inset-top,0px)) max(2vw,env(safe-area-inset-right,0px)) max(2vh,env(safe-area-inset-bottom,0px)) max(2vw,env(safe-area-inset-left,0px));
  background:rgba(1,12,30,.68);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.m-ov.open{opacity:1;visibility:visible;transition:opacity .3s}
.modal{--gc:#4fb3ff;width:min(76rem,100%);max-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;border-radius:1.6rem;
  background:linear-gradient(160deg,#0e3c69,#062a4e 70%);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,6,22,.6);
  transform:translateY(18px) scale(.97);transition:transform .4s var(--spring)}
.m-ov.open .modal{transform:none}
.modal::before{content:"";position:absolute;width:24rem;height:24rem;border-radius:50%;inset-inline-end:-9rem;top:-12rem;background:radial-gradient(circle,var(--gc),transparent 68%);opacity:.16;pointer-events:none}
.modal{position:relative}
.m-head{position:relative;display:flex;align-items:center;gap:.9rem;padding:1.1rem 1.3rem .9rem;border-bottom:1px solid var(--line)}
.m-ico{flex:none;width:3.6rem;height:3.6rem;border-radius:1.1rem;display:grid;place-items:center;font-size:1.9rem;line-height:1;background:color-mix(in srgb,var(--gc) 18%,transparent);border:1px solid color-mix(in srgb,var(--gc) 45%,transparent)}
.m-tt{flex:1;min-width:0}
.m-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.25rem}
.m-tags span{font-size:.74rem;font-weight:700;padding:.08rem .65rem;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.07)}
.m-tags .grp{background:color-mix(in srgb,var(--gc) 16%,transparent);border-color:color-mix(in srgb,var(--gc) 45%,transparent)}
.m-tt h2{font-size:1.45rem;line-height:1.35;text-wrap:balance}
.m-tt .alt{font-size:.82rem;color:var(--muted);line-height:1.4;margin-top:.1rem}
.x{flex:none;width:3rem;height:3rem;border-radius:.9rem;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:1.1rem;transition:background .2s,transform .3s var(--spring)}
.x:hover{background:rgba(255,255,255,.16);transform:rotate(90deg)}

.m-body{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.2rem;padding:1.1rem 1.3rem}
.m-info{min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:.75rem;padding-inline-end:.3rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent;-webkit-user-select:text;user-select:text}
.m-info h3{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:.25rem}
.m-info p{font-size:1rem;line-height:1.95;color:#e6f2fb}
.feats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem .9rem}
.feats li{display:flex;gap:.5rem;align-items:flex-start;font-size:.92rem;line-height:1.6}
.feats li::before{content:"✓";flex:none;width:1.25rem;height:1.25rem;margin-top:.15rem;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--ok);background:rgba(127,240,184,.14)}
.serves{display:flex;flex-wrap:wrap;gap:.4rem}
.serves span{display:inline-flex;align-items:center;gap:.35rem;font-size:.84rem;padding:.15rem .7rem;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.serves span.on{background:rgba(255,189,89,.2);border-color:rgba(255,189,89,.6);font-weight:700}
.serves span.all{border-style:dashed}

.m-qr{min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:.7rem;--qs:clamp(6.5rem,18vh,13rem)}
.qr-card{display:flex;flex-direction:column;align-items:center;gap:.45rem;padding:.75rem .9rem .7rem;border-radius:1.2rem;background:rgba(255,255,255,.06);border:1px solid var(--line);width:calc(var(--qs) + 1.8rem)}
.qr-lbl{display:flex;align-items:center;gap:.4rem;font-weight:700;font-size:.92rem}
.qr-box{width:var(--qs);height:var(--qs);border-radius:.9rem;background:var(--qr-paper);padding:.55rem;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,8,30,.35)}
.qr-box svg{width:100%;height:100%;display:block}
.qr-box.pending{background:rgba(255,255,255,.04);border:2px dashed rgba(183,221,244,.4);box-shadow:none;text-align:center;align-content:center;gap:.3rem;color:var(--soft);font-size:.82rem;line-height:1.5;padding:.8rem}
.qr-box.pending i{font-style:normal;font-size:1.8rem;line-height:1}
.qr-card small{font-size:.74rem;color:var(--soft);text-align:center;line-height:1.45}
.qr-url{font-size:.7rem;color:var(--muted);direction:ltr;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;-webkit-user-select:text;user-select:text}

.m-foot{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.7rem 1.3rem;border-top:1px solid var(--line);background:rgba(2,24,48,.45)}
.m-foot button{min-height:44px;padding:.35rem 1.1rem;border-radius:.85rem;border:1px solid var(--line);background:rgba(255,255,255,.08);font-weight:700;font-size:.9rem;transition:background .2s,transform .15s}
.m-foot button:hover{background:rgba(255,255,255,.16)}
.m-foot button:active{transform:scale(.95)}
.m-foot span{font-size:.85rem;color:var(--soft);font-variant-numeric:tabular-nums}
.m-swap{animation:swap .35s var(--ease)}
@keyframes swap{from{opacity:.2;transform:translateY(8px)}}

/* ===== Portrait screens & phones ===== */
@media (max-aspect-ratio:1/1),(max-width:760px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{padding:.7rem}
  .r-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
  .r-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem}
  .pb{flex-direction:column;justify-content:center;gap:.2rem;max-height:none;min-height:3.9rem;padding:.4rem .3rem;text-align:center;font-size:.8rem}
  .pb .pi{width:1.8rem;height:1.8rem;font-size:1rem}
  .pb .pl{line-height:1.25}
  .pb .pc{position:absolute;top:.25rem;inset-inline-end:.25rem;min-width:1.5rem;font-size:.68rem;padding:0 .35rem}
  .pb{position:relative}
  .pb[aria-pressed="true"]{transform:none}
}
@media (max-width:760px){
  .brand small{display:none}
  .tool .tl{display:none}
  .m-body{display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
  .m-info{flex:none;min-height:auto;overflow:visible;padding-inline-end:0}
  .m-qr{flex:none;overflow:visible;flex-direction:row;justify-content:center;--qs:min(8.5rem,34vw)}
  .feats{grid-template-columns:minmax(0,1fr)}
  .m-head{padding:.9rem 1rem .8rem}.m-body{padding:.9rem 1rem}.m-foot{padding:.6rem 1rem}
  .m-tt h2{font-size:1.2rem}.m-ico{width:3rem;height:3rem;font-size:1.5rem}
}
@media (max-width:380px){.m-qr{--qs:min(7rem,32vw)}.qr-card{padding:.6rem .5rem}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .bg-fx{display:none}
}
</style>
</head>
<body>

<div id="app" dir="rtl" lang="ar">
  <div class="bg-fx" id="bgfx" aria-hidden="true"><b></b><b class="b2"></b></div>

  <header class="topbar">

];

const FOR={s:['للطالب','for students'],f:['لعضو هيئة التدريس','for faculty'],e:['للموظف','for staff'],al:['للخريج','for alumni'],r:['للمتقاعد','for retirees'],c:['لأفراد المجتمع','for the community'],u:['لجهات الجامعة','for university units']};

const T={
 ar:{brand:'ملتقى التحول الرقمي 2026',sub:'قيمة وأثر · دليل المنتجات الرقمية',lang:'English',fs:'ملء الشاشة',fsOff:'إنهاء ملء الشاشة',
  rTitle:'من أنت؟',rSub:'اختر صفتك لعرض المنتجات التي تخدمك',all:'الكل',
  kAll:'21 منتجًا رقميًا في الملتقى',kP:'منتجات تخدمك',hAll:'جميع <span class="grad">المنتجات الرقمية</span>',hP:f=>`المنتجات المتاحة <span class="grad">${f}</span>`,
  plat:'منصة',serv:'خدمة',plats:n=>`${n} منصة`,servs:n=>`${n} خدمات`,ded:'مخصصة',forAll:'للجميع',dedN:n=>`<b>${n}</b> مخصصة`,genN:n=>`<b>${n}</b> للجميع`,
  hint:'اضغط على أي منتج لعرض تفاصيله ورمز QR',more:'التفاصيل',
  descH:'الوصف',featH:'المزايا',servesH:'يخدم',allBen:'جميع المستفيدين',primary:'الفئة الرئيسية',
  qService:'رابط الخدمة',qGuide:'دليل المستخدم',scan:'امسح الرمز بكاميرا الجوال',pending:'الرابط قيد الإضافة',noLib:'تعذّر إنشاء الرمز، استخدم الرابط',
  prev:'→ السابق',next:'التالي ←',close:'إغلاق',
  foot:'إعداد لجنة المنتجات الرقمية للملتقى الرقمي 2026م · 5 نوفمبر 2026م'},
 en:{brand:'Digital Transformation Forum 2026',sub:'Value & Impact · Digital Products Guide',lang:'العربية',fs:'Full screen',fsOff:'Exit full screen',
  rTitle:'Who are you?',rSub:'Choose your role to see the products that serve you',all:'All',
  kAll:'21 digital products at the forum',kP:'Products that serve you',hAll:'All <span class="grad">digital products</span>',hP:f=>`Products available <span class="grad">${f}</span>`,
  plat:'Platform',serv:'Service',plats:n=>`${n} platforms`,servs:n=>`${n} services`,ded:'Dedicated',forAll:'For all',dedN:n=>`<b>${n}</b> dedicated`,genN:n=>`<b>${n}</b> for all`,
  hint:'Tap any product for details and QR codes',more:'Details',
  descH:'Description',featH:'Features',servesH:'Serves',allBen:'All beneficiaries',primary:'Primary group',
  qService:'Service link',qGuide:'User guide',scan:'Scan with your phone camera',pending:'Link coming soon',noLib:'QR unavailable, use the link',
  prev:'← Previous',next:'Next →',close:'Close',
  foot:'Prepared by the Digital Products Committee, Digital Forum 2026 · 5 November 2026'}
};

const S={lang:'ar',p:null,list:[],idx:0};
try{const l=localStorage.getItem('dfp_lang');if(l==='ar'||l==='en')S.lang=l}catch(e){}
const tx=()=>T[S.lang],L=o=>o[S.lang];
const gName=k=>S.lang==='ar'?GROUPS[k].ar:GROUPS[k].en;
const pLabel=k=>S.lang==='ar'?PK[k].ar:PK[k].en;
const pB=k=>S.lang==='ar'?PK[k].arB:PK[k].enB;
const tileName=p=>(TILE[p.n]&&TILE[p.n][S.lang])||L(p).short;
const serves=(p,k)=>p.tags.includes(k)||p.g==='gen';
const ALL=ORDER.flatMap(k=>P.filter(p=>p.g===k));
function listFor(k){
  if(!k)return ALL;
  const d=ALL.filter(p=>p.tags.includes(k)),g=ALL.filter(p=>p.g==='gen');
  return [...d,...g];
}
const reduced=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};

/* ---------- ambient ---------- */
(()=>{if(reduced())return;const fx=$('#bgfx');let h='';for(let i=0;i<9;i++){const s=(18+Math.random()*34)|0;
  h+=`<i style="--x:${(Math.random()*96).toFixed(1)}%;--s:${s}px;--o:${(.12+Math.random()*.2).toFixed(2)};--d:${(18+Math.random()*16).toFixed(1)}s;--dl:-${(Math.random()*30).toFixed(1)}s"></i>`}
  fx.insertAdjacentHTML('beforeend',h)})();

/* ---------- static text ---------- */
function renderStatic(){
  const t=tx(),app=$('#app'),dir=S.lang==='ar'?'rtl':'ltr';
  app.dir=dir;app.lang=S.lang;document.documentElement.lang=S.lang;document.documentElement.dir=dir;
  $('#tBrand').textContent=t.brand;$('#tSub').textContent=t.sub;
  $('#langBtn').textContent=t.lang;$('#langBtn').setAttribute('lang',S.lang==='ar'?'en':'ar');
  $('#rTitle').textContent=t.rTitle;$('#rSub').textContent=t.rSub;
  $('#rail').setAttribute('aria-label',t.rTitle);
  $('#rail').innerHTML=`<button type="button" class="pb" data-p=""><span class="pi" aria-hidden="true">✦</span><span class="pl">${t.all}</span><span class="pc">${ALL.length}</span></button>`+
    PERS.map(pp=>`<button type="button" class="pb" data-p="${pp.k}"><span class="pi" aria-hidden="true">${pp.ic}</span><span class="pl">${pLabel(pp.k)}</span><span class="pc">${listFor(pp.k).length}</span></button>`).join('');
  $('#foot').textContent=t.foot;
  fsLabel();
}

/* ---------- services panel ---------- */
function renderPanel(anim){
  const t=tx(),k=S.p,list=listFor(k);S.list=list.map(p=>p.n);
  $$('#rail .pb').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.p||null)===k)));
  $('#pKick').textContent=k?t.kP:t.kAll;
  $('#pTitle').innerHTML=k?t.hP(FOR[k][S.lang==='ar'?0:1]):t.hAll;
  const nP=list.filter(p=>p.t==='p').length;
  let meta='';
  if(k){const d=list.filter(p=>p.g!=='gen').length;
    meta=`<span class="chip"><i class="sw"></i>${t.dedN(d)}</span><span class="chip"><i class="sw g"></i>${t.genN(list.length-d)}</span>`}
  else meta=`<span class="chip"><b>${nP}</b>${S.lang==='ar'?'منصة':'platforms'}</span><span class="chip"><b>${list.length-nP}</b>${S.lang==='ar'?'خدمات':'services'}</span>`;
  meta+=`<span class="chip hint">👆 ${t.hint}</span>`;
  $('#pMeta').innerHTML=meta;
  const arrow=S.lang==='ar'?'←':'→';
  const g=$('#grid');
  g.innerHTML=list.map((p,i)=>{const G=GROUPS[p.g],gen=k&&p.g==='gen';
    const tag=!k?`<span class="t-tag"><span aria-hidden="true">${G.ic}</span>${esc(gName(p.g))}</span>`
      :gen?`<span class="t-tag"><span aria-hidden="true">🌐</span>${t.forAll}</span>`:`<span class="t-tag d">✓ ${t.ded}</span>`;
    return `<button type="button" class="tile${gen?' gen':''}" style="--gc:${G.c};--i:${i}" data-open="${p.n}">
      <span class="t-top"><span class="t-ico" aria-hidden="true"><span>${p.ic}</span></span><span class="t-type ${p.t}">${p.t==='p'?t.plat:t.serv}</span></span>
      <span class="t-name">${esc(tileName(p))}</span>
      <span class="t-foot">${tag}<span class="t-go" aria-hidden="true">${arrow}</span></span></button>`}).join('');
  g.classList.remove('enter');
  if(anim&&!reduced()){void g.offsetWidth;g.classList.add('enter')}
  fit();
}

/* size the tiles so every product fits the remaining screen height */
function fit(){
  const g=$('#grid'),n=g.children.length;if(!n)return;
  const cs=getComputedStyle(g),rem=parseFloat(getComputedStyle(document.documentElement).fontSize)||16;
  g.classList.remove('scroll');g.style.removeProperty('--k');
  const gap=parseFloat(cs.rowGap)||10,W=g.clientWidth,H=g.clientHeight;
  let best=null;
  for(let c=1;c<=n;c++){
    const r=Math.ceil(n/c),w=(W-(c-1)*gap)/c,h=(H-(r-1)*gap)/r;if(w<=0||h<=0)continue;
    const score=Math.min(w,h*1.2)*(1-.5*(r*c-n)/(r*c));
    if(!best||score>best.score)best={c,r,w,h,score};
  }
  const minH=7.2*rem,minW=8.6*rem;
  if(!best||best.h<minH||best.w<minW){
    const c=Math.max(1,Math.floor((W+gap)/(10*rem+gap)));
    g.style.setProperty('--c',c);g.classList.add('scroll');
    g.style.setProperty('--k',Math.max(.8,Math.min(1,((W-(c-1)*gap)/c)/(10.5*rem))).toFixed(3));
    return;
  }
  g.style.setProperty('--c',best.c);g.style.setProperty('--r',best.r);
  let k=Math.max(.72,Math.min(1.4,best.h/(10*rem),best.w/(10.8*rem)));
  g.style.setProperty('--k',k.toFixed(3));
  const tiles=[...g.children],over=()=>tiles.some(t=>t.scrollHeight>t.clientHeight+1);
  for(let i=0;i<12&&k>.72&&over();i++){k-=.05;g.style.setProperty('--k',k.toFixed(3))}
}

/* ---------- QR ---------- */
function qrSVG(url){
  if(typeof qrcode!=='function')return null;
  try{
    if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8'])qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
    const q=qrcode(0,'M');q.addData(url);q.make();
    const n=q.getModuleCount(),m=2;let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="100%" height="100%" fill="#ffffff"/><path d="${d}" fill="#013364"/></svg>`;
  }catch(e){return null}
}
function qrCard(label,ic,url){
  const t=tx();
  if(!url)return `<div class="qr-card"><div class="qr-lbl"><span aria-hidden="true">${ic}</span>${label}</div><div class="qr-box pending"><i aria-hidden="true">⏳</i>${t.pending}</div><small>&nbsp;</small></div>`;
  const svg=qrSVG(url);
  return `<div class="qr-card"><div class="qr-lbl"><span aria-hidden="true">${ic}</span>${label}</div>
    ${svg?`<div class="qr-box">${svg}</div>`:`<div class="qr-box pending">${t.noLib}</div>`}
    <small>${t.scan}</small><span class="qr-url" title="${esc(url)}">${esc(url.replace(/^https?:\/\//,''))}</span></div>`;
}

/* ---------- modal ---------- */
let lastFocus=null;
function modalHTML(){
  const t=tx(),p=BY[S.list[S.idx]],G=GROUPS[p.g],d=L(p),o=S.lang==='ar'?p.en:p.ar,lk=LINKS[p.n]||{};
  const sv=p.g==='gen'?`<span class="all">🌐 ${t.allBen}</span>`:p.tags.map(k=>`<span class="${S.p===k?'on':''}"><span aria-hidden="true">${PK[k].ic}</span>${pB(k)}</span>`).join('');
  return `<div class="m-head"><span class="m-ico" aria-hidden="true">${p.ic}</span>
      <div class="m-tt"><div class="m-tags"><span>${p.t==='p'?t.plat:t.serv}</span><span class="grp">${G.ic} ${esc(gName(p.g))}</span></div>
      <h2 id="mTitle">${esc(d.name)}</h2><div class="alt"><bdi lang="${S.lang==='ar'?'en':'ar'}">${esc(o.name)}</bdi></div></div>
      <button type="button" class="x" id="mClose" aria-label="${t.close}">✕</button></div>
    <div class="m-body"><div class="m-info">
      <section><h3>${t.descH}</h3><p>${esc(d.desc)}</p></section>
      <section><h3>${t.featH}</h3><ul class="feats">${d.feat.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></section>
      <section><h3>${t.servesH}</h3><div class="serves">${sv}</div></section>
    </div><div class="m-qr">${qrCard(t.qService,'🔗',lk.service)}${qrCard(t.qGuide,'📘',lk.guide)}</div></div>
    <div class="m-foot"><button type="button" data-step="-1">${t.prev}</button><span>${S.idx+1} / ${S.list.length}</span><button type="button" data-step="1">${t.next}</button></div>`;
}
function paintModal(swap){
  const m=$('#modal'),p=BY[S.list[S.idx]];
  m.style.setProperty('--gc',GROUPS[p.g].c);m.innerHTML=modalHTML();
  if(swap&&!reduced()){m.querySelector('.m-body').classList.add('m-swap')}
}
function openModal(n){
  S.idx=Math.max(0,S.list.indexOf(n));lastFocus=document.activeElement;
  paintModal(false);$('#ov').classList.add('open');
  setTimeout(()=>{const c=$('#mClose');if(c)c.focus({preventScroll:true})},60);
}
function step(s){S.idx=(S.idx+s+S.list.length)%S.list.length;paintModal(true);const b=$(`#modal [data-step="${s}"]`);if(b)b.focus({preventScroll:true})}
function closeModal(){if(!$('#ov').classList.contains('open'))return;$('#ov').classList.remove('open');if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
const isOpen=()=>$('#ov').classList.contains('open');

/* ---------- full screen ---------- */
const fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function fsLabel(){const on=!!(document.fullscreenElement||document.webkitFullscreenElement);$('#fsLbl').textContent=on?tx().fsOff:tx().fs;$('#fsBtn').setAttribute('aria-label',on?tx().fsOff:tx().fs)}
if(fsOK)$('#fsBtn').hidden=false;
document.addEventListener('fullscreenchange',fsLabel);document.addEventListener('webkitfullscreenchange',fsLabel);

/* ---------- events ---------- */
$('#app').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(b.id==='langBtn'){S.lang=S.lang==='ar'?'en':'ar';try{localStorage.setItem('dfp_lang',S.lang)}catch(x){}renderStatic();renderPanel(false);if(isOpen())paintModal(false);return}
  if(b.id==='fsBtn'){const el=document.documentElement,on=document.fullscreenElement||document.webkitFullscreenElement;
    try{const r=on?(document.exitFullscreen||document.webkitExitFullscreen).call(document):(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(r&&r.catch)r.catch(()=>{})}catch(x){}return}
  if('p' in d){const k=d.p||null;if(k!==S.p){S.p=k;renderPanel(true)}return}
  if('open' in d){openModal(Number(d.open));return}
  if('step' in d){step(Number(d.step));return}
  if(b.id==='mClose'){closeModal();return}
});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{
  if(!isOpen())return;
  if(e.key==='Escape'){e.preventDefault();closeModal();return}
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const fwd=(e.key==='ArrowLeft')===(S.lang==='ar');step(fwd?1:-1);return}
  if(e.key==='Tab'){const f=$$('#modal button');if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
/* swipe between products inside the popup */
let sx=null,sy=null;
$('#modal').addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
$('#modal').addEventListener('touchend',e=>{if(sx===null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){const fwd=(dx>0)===(S.lang==='ar');step(fwd?1:-1)}},{passive:true});

/* return to the start after a quiet period (kiosk) */
let idleT=null;
function poke(){clearTimeout(idleT);if(IDLE_SECONDS>0)idleT=setTimeout(()=>{closeModal();if(S.p!==null){S.p=null;renderPanel(true)}},IDLE_SECONDS*1000)}
['pointerdown','keydown','touchstart','wheel'].forEach(ev=>document.addEventListener(ev,poke,{passive:true}));

/* refit on resize and after the web font arrives */
let rq=null;const refit=()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(fit)};
if('ResizeObserver' in window)new ResizeObserver(refit).observe($('#grid'));else window.addEventListener('resize',refit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refit);

renderStatic();renderPanel(true);poke();
})();
</script>
